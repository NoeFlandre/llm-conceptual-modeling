name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync locked environment
        run: uv sync --locked --dev
      - name: Restore minimal integration-test artifacts
        run: uv run --locked --no-sync --no-env-file python scripts/restore_ci_artifacts.py
      - name: Run local CI gate
        run: make ci
